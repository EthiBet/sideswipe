<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sideswipe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a0a;
      width: 100%;
      height: 100%;
    }
    #scene-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(40, 40, 40, 0.85);
      color: #4ade80;
      font-family: monospace;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 90vw;
      z-index: 100;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>
  <div id="debug-panel">Loading...</div>

  <script type="module" src="./main.js"></script>
</body>
</html>
