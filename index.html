<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sideswipe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a0a;
      width: 100%;
      height: 100%;
    }
    #scene-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(40, 40, 40, 0.85);
      color: #4ade80;
      font-family: monospace;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 90vw;
      z-index: 100;
      white-space: pre-wrap;
    }

    /* ---------- Scoreboard (top center) ---------- */
    #scoreboard {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 28px;
      color: white;
      z-index: 60;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    #score-blue { color: #3b82f6; }
    #score-orange { color: #f97316; }
    #match-timer {
      font-size: 20px;
      font-family: monospace;
      opacity: 0.9;
    }
    #match-banner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: sans-serif;
      font-weight: bold;
      font-size: 42px;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      z-index: 90;
      display: none;
      text-align: center;
    }

    /* ---------- Joystick (bottom-left) ---------- */
    #joystick-base {
      position: fixed;
      bottom: 40px;
      left: 40px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      touch-action: none;
      z-index: 50;
    }
    #joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      margin: -28px 0 0 -28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }

    /* ---------- Buttons (bottom-right) ---------- */
    #button-cluster {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: white;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      user-select: none;
      touch-action: none;
      border: 3px solid rgba(255, 255, 255, 0.3);
    }
    #jump-btn {
      width: 80px;
      height: 80px;
      background: #2563eb;
    }
    #boost-btn {
      width: 90px;
      height: 90px;
      background: #ea580c;
      position: relative;
    }
    #boost-fill {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(#fbbf24 0deg, transparent 0deg);
      pointer-events: none;
    }
    #rotate-btn {
      width: 64px;
      height: 64px;
      background: #7c3aed;
    }
    .bottom-row {
      display: flex;
      gap: 14px;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="scoreboard">
    <span id="score-blue">0</span>
    <span id="match-timer">2:00</span>
    <span id="score-orange">0</span>
  </div>
  <div id="match-banner"></div>

  <canvas id="scene-canvas"></canvas></canvas>
  <div id="debug-panel">Loading...</div>

  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <div id="button-cluster">
    <div id="jump-btn" class="action-btn">JUMP</div>
    <div class="bottom-row">
      <div id="boost-btn" class="action-btn">
        <div id="boost-fill"></div>
        <span style="position: relative; z-index: 1;">BOOST</span>
      </div>
      <div id="rotate-btn" class="action-btn">↺</div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script>
    // Catch anything that goes wrong anywhere on the page, since DevTools
    // isn't available to read errors from the console.
    const panel = document.getElementById('debug-panel');
    window.addEventListener('error', (e) => {
      panel.textContent = 'PAGE ERROR: ' + (e.message || e) +
        (e.filename ? '\nFile: ' + e.filename + ':' + e.lineno : '');
    });
    window.addEventListener('unhandledrejection', (e) => {
      panel.textContent = 'PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script type="module">
    // Dynamic import wrapped in a catch - a top-level `import` statement
    // fails silently with no error surfaced if the module (or a CDN it
    // depends on) can't load, so we do it this way instead.
    import('./main.js').catch((err) => {
      panel.textContent = 'FAILED TO LOAD main.js: ' + (err.message || err);
    });
  </script>
</body>
</html>
