<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sideswipe</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a0a;
      width: 100%;
      height: 100%;
    }
    #scene-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #debug-panel {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(40, 40, 40, 0.85);
      color: #4ade80;
      font-family: monospace;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 90vw;
      z-index: 100;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="scene-canvas"></canvas>
  <div id="debug-panel">Loading...</div>

  <script>
    // Catch anything that goes wrong anywhere on the page, since DevTools
    // isn't available to read errors from the console.
    const panel = document.getElementById('debug-panel');
    window.addEventListener('error', (e) => {
      panel.textContent = 'PAGE ERROR: ' + (e.message || e) +
        (e.filename ? '\nFile: ' + e.filename + ':' + e.lineno : '');
    });
    window.addEventListener('unhandledrejection', (e) => {
      panel.textContent = 'PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script type="module">
    // Dynamic import wrapped in a catch - a top-level `import` statement
    // fails silently with no error surfaced if the module (or a CDN it
    // depends on) can't load, so we do it this way instead.
    import('./main.js').catch((err) => {
      panel.textContent = 'FAILED TO LOAD main.js: ' + (err.message || err);
    });
  </script>
</body>
</html>
